[workspace]
resolver = "2"
members = [
    "crates/rc-capture-macos",
    "crates/rc-encode-vt",
    "crates/rc-decode-vt",
    "crates/rc-render-macos",
    "crates/rc-input-macos",
    "crates/rc-audio-macos",
    "crates/rc-clipboard-macos",
    "crates/rc-host-macos",
    "crates/rc-platform-macos",
    "crates/rc-cli",
    "crates/rc-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"

[workspace.dependencies]
rc-types = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-diff = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-sched = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-fec = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-proto = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-trace = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-loopback = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-capture = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-encode = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-decode = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-render = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-input = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-audio = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-pipeline = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-net = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-session = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-tools = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }
rc-client-core = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.0" }

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0
debug = 1

[profile.dev-debug]
inherits = "dev"
debug = 2

[profile.bench]
inherits = "release"
debug = 1
lto = "thin"
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
