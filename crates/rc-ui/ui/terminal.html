<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>终端远控 — RabbitControl</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/pages/terminal.css" />
</head>
<!-- W3 终端远控窗口：会话管理列表（亮色默认视图）+ 交互式终端（暗色视图） -->
<body data-page="terminal">
  <script src="assets/js/tauri-detect.js"></script>
  <div class="tm-window" id="terminal-window" data-view="list">
    <header class="tm-titlebar" id="terminal-titlebar" data-tauri-drag-region>
      <div class="tm-traffic" aria-hidden="true" data-tauri-drag-region>
        <span class="tm-traffic__dot tm-traffic__dot--close" data-tauri-drag-region></span>
        <span class="tm-traffic__dot tm-traffic__dot--min" data-tauri-drag-region></span>
        <span class="tm-traffic__dot tm-traffic__dot--zoom" data-tauri-drag-region></span>
      </div>
      <button type="button" class="tm-back-btn" id="tm-back-to-list" hidden aria-label="返回会话列表">
        ← 会话列表
      </button>
      <h1 class="tm-win-title" id="terminal-title" data-tauri-drag-region>终端远控</h1>
    </header>

    <!-- 视图 1：终端会话管理列表（默认开启态，与设计截图一致） -->
    <main class="tm-manager" id="terminal-list-view">
      <div class="tm-mgr-header">
        <div class="tm-mgr-device">
          <span class="tm-mgr-device__name" id="tm-device-name">远程设备</span>
          <span class="tm-mgr-status">
            <span class="tm-mgr-dot" id="tm-mgr-dot" aria-hidden="true"></span>
            <span class="tm-mgr-status__text" id="tm-mgr-status-text">连接中…</span>
          </span>
        </div>
        <button type="button" class="tm-btn-light" id="tm-create-session">创建会话</button>
      </div>

      <div class="tm-session-list" id="tm-session-list" role="list" aria-label="终端会话列表"></div>

      <div class="tm-empty" id="tm-empty-state" hidden>
        <p class="tm-empty__text" id="tm-empty-text">暂无运行中的终端会话，点击右上角「创建会话」开始</p>
      </div>
    </main>

    <!-- 视图 2：交互式 PTY 终端 -->
    <main class="tm-body" id="terminal-live-view" hidden>
      <!-- 多会话快速切换栏（所有后台运行会话） -->
      <div class="tm-tabs" id="terminal-tabs" role="tablist" aria-label="后台终端会话">
        <div class="tm-tabs__list" id="terminal-tab-list"></div>
        <button type="button" class="tm-tabs__add" id="terminal-new-tab" title="创建新终端会话（最多 8 个）" aria-label="创建新终端会话">+</button>
      </div>

      <!-- 实时交互终端头栏 -->
      <div class="tm-status-bar" id="terminal-status-bar">
        <div class="tm-status-bar__left">
          <span class="tm-status-dot" id="terminal-status-dot" aria-hidden="true"></span>
          <span class="tm-status-text" id="terminal-status-text">连接中…</span>
          <span class="tm-tag" id="terminal-cwd" hidden></span>
        </div>
        <div class="tm-status-bar__right" id="terminal-status-right">
          <span class="tm-timer" id="terminal-timer" role="timer" aria-live="off">00:00:00</span>
          <button type="button" class="tm-btn tm-btn--icon" id="tm-live-more" aria-label="会话操作">…</button>
          <button type="button" class="tm-btn" id="terminal-reconnect" hidden>重新连接</button>
        </div>
      </div>

      <!-- 交互终端输出舞台（独立定位容器，确保 .tm-notice 不遮挡上方标签栏与状态栏） -->
      <div class="tm-stage" id="terminal-stage">
        <!-- 实时 PTY 输出区（零 innerHTML，安全 DOM 节点渲染） -->
        <pre class="tm-screen" id="terminal-screen" tabindex="0" aria-label="远程终端"></pre>

        <!-- 中文输入法组合输入代理（透明定位，不影响视觉） -->
        <textarea class="tm-ime-input" id="terminal-ime" autocomplete="off" autocorrect="off"
                  autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>

        <!-- 未连接 / 异常居中提示 -->
        <div class="tm-notice" id="terminal-notice" hidden>
          <p class="tm-notice__text" id="terminal-notice-text">请先建立远控会话</p>
          <div class="tm-notice__actions">
            <button type="button" class="tm-btn" id="terminal-notice-back">返回列表</button>
            <button type="button" class="tm-btn tm-btn--primary" id="terminal-notice-reconnect">重新附着</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 「...」浮层菜单：重命名 / 终止会话 -->
  <div class="tm-more-menu" id="tm-more-menu" role="menu" hidden>
    <button type="button" class="tm-more-menu__item" id="tm-menu-rename" role="menuitem">重命名</button>
    <button type="button" class="tm-more-menu__item tm-more-menu__item--danger" id="tm-menu-terminate" role="menuitem">终止会话</button>
  </div>

  <!-- 重命名会话弹窗 -->
  <div class="tm-modal-backdrop" id="tm-rename-backdrop" hidden>
    <div class="tm-modal" role="dialog" aria-modal="true" aria-labelledby="tm-rename-title">
      <h2 class="tm-modal__title" id="tm-rename-title">重命名会话</h2>
      <form class="tm-modal__form" id="tm-rename-form">
        <input type="text" class="tm-modal__input" id="tm-rename-input" maxlength="64"
               autocomplete="off" placeholder="请输入会话名称" />
        <p class="tm-modal__error" id="tm-rename-error" hidden></p>
        <div class="tm-modal__actions">
          <button type="button" class="tm-btn-light" id="tm-rename-cancel">取消</button>
          <button type="submit" class="tm-btn-light tm-btn-light--primary" id="tm-rename-confirm">确定</button>
        </div>
      </form>
    </div>
  </div>

  <div class="tm-toast" id="tm-toast" role="status" aria-live="polite"></div>

  <script src="assets/js/bridge.js"></script>
  <script src="assets/js/terminal.js"></script>
</body>
</html>
