# rc-ui 自定义 IPC 命令权限（Tauri v2 ACL）
#
# 主窗口需要调用：
#   open_tool_window(kind)  → 打开 W1–W4 独立工具窗口（§8.3）
#   open_session_window()   → 打开 S1 远控会话窗口（§8.3）
[[permission]]
identifier = "allow-window-open"
description = "允许前端打开工具窗口与会话窗口（设计文档 §8.3 多窗口）。"
commands.allow = ["open_tool_window", "open_session_window"]

[[permission]]
identifier = "allow-session-ipc"
description = "允许前端调用 T21 会话控制、输入桥接、表单校验与剪贴板 IPC 命令。"
commands.allow = [
  "list_devices",
  "parse_connect_target",
  "open_session",
  "session_command",
  "session_snapshot",
  "send_input_event",
  "stage_rect",
