[package]
name = "rc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RabbitControl 诊断 CLI：回环测试、后端探测与版本信息。"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rc-types = { workspace = true }
rc-loopback = { workspace = true }
rc-pipeline = { workspace = true }
rc-session = { workspace = true }
rc-input = { workspace = true }
# host/client 子命令的管线后端构造（fake 栈 / real 标签校验；T18）
rc-capture = { workspace = true }
rc-encode = { workspace = true }
rc-decode = { workspace = true }
rc-render = { workspace = true }
rc-platform-macos = { path = "../rc-platform-macos" }

[target.'cfg(target_os = "macos")'.dependencies]
rc-capture-macos = { path = "../rc-capture-macos" }
# host --inject-mode real / client --input-mode real（CGEvent 桥，需权限）
rc-input-macos = { path = "../rc-input-macos" }
# host --tray（macOS 菜单栏托盘 + 连接审批弹窗；T22）
rc-host-macos = { path = "../rc-host-macos" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
