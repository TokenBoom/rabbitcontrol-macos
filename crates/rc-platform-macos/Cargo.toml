[package]
name = "rc-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RabbitControl macOS 平台能力总成：向核心层注入采集/编解码/渲染/音频/剪贴板与客户端硬件钩子。"

[dependencies]
rc-audio = { workspace = true }
rc-capture = { workspace = true }
rc-client-core = { workspace = true }
rc-decode = { workspace = true }
rc-encode = { workspace = true }
rc-input = { workspace = true }
rc-pipeline = { workspace = true }
rc-render = { workspace = true }
rc-session = { workspace = true }
rc-types = { workspace = true }
rc-audio-macos = { path = "../rc-audio-macos" }
rc-clipboard-macos = { path = "../rc-clipboard-macos" }

[target.'cfg(target_os = "macos")'.dependencies]
rc-capture-macos = { path = "../rc-capture-macos" }
rc-decode-vt = { path = "../rc-decode-vt" }
rc-encode-vt = { path = "../rc-encode-vt" }
rc-input-macos = { path = "../rc-input-macos" }
rc-render-macos = { path = "../rc-render-macos" }
